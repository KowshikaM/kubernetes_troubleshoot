services:
  backend:
    build:
      context: ./backend
    container_name: ai-kube-backend
    ports:
      # Host port 8001 -> container 8000 (8000 is used by another local project)
      - "8001:8000"
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      KUBECONFIG_PATH: ${KUBECONFIG_PATH:-}
      KUBECTL_BIN: ${KUBECTL_BIN:-kubectl}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8001}
    container_name: ai-kube-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
